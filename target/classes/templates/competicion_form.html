<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Fútbol - Competición')}"></head>
<body>

	<div th:replace="~{fragments/header :: header}"></div>

	<div class="container py-5">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card card-glass">
					<div class="card-header py-3">
						<h4 class="mb-0 d-flex align-items-center gap-2">
							<i class="bi" th:classappend="${competicion.id} == null ? 'bi-plus-circle' : 'bi-pencil-square'"></i>
							<span th:text="${competicion.id} == null ? 'Nueva Competición' : 'Editar Competición'"></span>
						</h4>
					</div>
					<div class="card-body p-4">
						<form th:action="@{/competiciones/guardar}" th:object="${competicion}" method="post" novalidate>
							<input type="hidden" th:field="*{id}" />

							<div class="mb-3">
								<label class="form-label text-muted small">NOMBRE</label>
								<input type="text" class="form-control form-control-dark" th:field="*{nombre}"
									th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
								<div class="invalid-feedback" th:errors="*{nombre}"></div>
							</div>
							<div class="mb-3">
								<label class="form-label text-muted small">MONTO DEL PREMIO</label>
								<input type="number" class="form-control form-control-dark" th:field="*{montoPremio}"
									th:classappend="${#fields.hasErrors('montoPremio')} ? 'is-invalid'">
								<div class="invalid-feedback" th:errors="*{montoPremio}"></div>
							</div>
							<div class="row g-3 mb-4">
								<div class="col-md-6">
									<label class="form-label text-muted small">FECHA DE INICIO</label>
									<input type="date" class="form-control form-control-dark" th:field="*{fechaInicio}"
										th:classappend="${#fields.hasErrors('fechaInicio')} ? 'is-invalid'">
									<div class="invalid-feedback" th:errors="*{fechaInicio}"></div>
								</div>
								<div class="col-md-6">
									<label class="form-label text-muted small">FECHA DE FIN</label>
									<input type="date" class="form-control form-control-dark" th:field="*{fechaFin}"
										th:classappend="${#fields.hasErrors('fechaFin') or #fields.hasErrors('fechasValidas')} ? 'is-invalid'">
									<div class="invalid-feedback" th:errors="*{fechaFin}"></div>
									<div class="invalid-feedback" th:errors="*{fechasValidas}"></div>
								</div>
							</div>

							<div class="d-flex justify-content-between">
								<a href="/competiciones/listar" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Cancelar</a>
								<button type="submit" class="btn btn-gradient px-4"><i class="bi bi-check2-circle me-1"></i>Guardar</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
