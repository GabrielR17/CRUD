<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Fútbol - Club')}"></head>
<body>

	<div th:replace="~{fragments/header :: header}"></div>

	<div class="container py-5">
		<div class="row justify-content-center">
			<div class="col-md-8 col-lg-7">
				<div th:replace="~{fragments/alertas :: alertas}"></div>
				<div class="card card-glass card-sin-blur">
					<div class="card-header py-3">
						<h4 class="mb-0 d-flex align-items-center gap-2">
							<i class="bi" th:classappend="${club.id} == null ? 'bi-plus-circle' : 'bi-pencil-square'"></i>
							<span th:text="${club.id} == null ? 'Nuevo Club' : 'Editar Club'"></span>
						</h4>
					</div>
					<div class="card-body p-4">
						<form th:action="@{/guardar}" th:object="${club}" method="post" novalidate>
							<input type="hidden" th:field="*{id}" />

							<div class="mb-4">
								<label class="form-label text-muted small">NOMBRE DEL CLUB</label>
								<input type="text" class="form-control form-control-dark" th:field="*{nombre}"
									th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" placeholder="Nombre del club">
								<div class="invalid-feedback" th:errors="*{nombre}"></div>
							</div>

							<div class="row g-3 mb-4">
								<div class="col-md-6">
									<label class="form-label text-muted small"><i class="bi bi-person-badge me-1"></i>ENTRENADOR</label>
									<select name="entrenadorId" class="form-select form-control-dark">
										<option value="">Sin entrenador</option>
										<option th:each="e : ${entrenadores}" th:value="${e.id}"
											th:text="${e.nombre} + ' ' + ${e.apellido}" th:selected="${e.id == entrenadorSel}"></option>
									</select>
									<div class="form-text">Solo se muestran entrenadores libres o el actual del club.</div>
								</div>
								<div class="col-md-6">
									<label class="form-label text-muted small"><i class="bi bi-building me-1"></i>ASOCIACIÓN</label>
									<select name="asociacionId" class="form-select form-control-dark">
										<option value="">Sin asociación</option>
										<option th:each="a : ${asociaciones}" th:value="${a.id}"
											th:text="${a.nombre}" th:selected="${a.id == asociacionSel}"></option>
									</select>
								</div>
							</div>

							<div class="mb-4">
								<label class="form-label text-muted small"><i class="bi bi-people me-1"></i>JUGADORES</label>
								<div class="buscador" id="buscadorJugadores">
									<div class="input-group">
										<span class="input-group-text bg-transparent border-secondary-subtle"><i class="bi bi-search"></i></span>
										<input type="text" id="buscarJugador" class="form-control form-control-dark"
											placeholder="Buscar jugador por nombre, apellido o posición..." autocomplete="off">
									</div>
									<div id="resultadosJugador" class="list-group lista-busqueda d-none">
										<button type="button" class="list-group-item list-group-item-action opcion-jugador"
											th:each="j : ${jugadores}"
											th:attr="data-id=${j.id},data-texto=${'#' + j.numero + ' ' + j.nombre + ' ' + j.apellido},data-seleccionado=${jugadoresSel.contains(j.id)}">
											<span th:text="'#' + ${j.numero} + ' ' + ${j.nombre} + ' ' + ${j.apellido}"></span>
											<span class="detalle-jugador ms-1" th:text="'· ' + ${j.posicion}"></span>
										</button>
										<div id="sinCoincidencias" class="list-group-item text-muted d-none">No hay coincidencias</div>
									</div>
								</div>
								<div id="jugadoresSeleccionados" class="d-flex flex-wrap gap-2 mt-3"></div>
								<p id="sinJugadores" class="text-muted small mt-2 mb-0">Ningún jugador seleccionado.</p>
								<p th:if="${jugadores.isEmpty()}" class="text-muted small mb-0">No hay jugadores libres. <a href="/jugadores/nuevo">Crear jugador</a></p>
								<div class="form-text">Solo se muestran jugadores libres o que ya son de este club.</div>
							</div>

							<div class="mb-4">
								<label class="form-label text-muted small"><i class="bi bi-award me-1"></i>COMPETICIONES</label>
								<div class="row row-cols-1 row-cols-md-2 g-1">
									<div class="col" th:each="comp : ${competiciones}">
										<div class="form-check">
											<input class="form-check-input" type="checkbox" name="competicionIds" th:value="${comp.id}"
												th:id="'comp' + ${comp.id}" th:checked="${competicionesSel.contains(comp.id)}">
											<label class="form-check-label" th:for="'comp' + ${comp.id}" th:text="${comp.nombre}"></label>
										</div>
									</div>
								</div>
								<p th:if="${competiciones.isEmpty()}" class="text-muted small mb-0">No hay competiciones. <a href="/competiciones/nuevo">Crear competición</a></p>
							</div>

							<div class="d-flex justify-content-between">
								<a href="/listar" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Cancelar</a>
								<button type="submit" class="btn btn-gradient px-4"><i class="bi bi-check2-circle me-1"></i>Guardar</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		// Buscador de jugadores: filtra la lista mientras se escribe y muestra los elegidos como chips,
		// cada uno con un input oculto "jugadorIds" que es lo que recibe el controlador
		(function () {
			const buscador = document.getElementById('buscadorJugadores');
			const input = document.getElementById('buscarJugador');
			const lista = document.getElementById('resultadosJugador');
			const opciones = Array.from(lista.querySelectorAll('.opcion-jugador'));
			const sinCoincidencias = document.getElementById('sinCoincidencias');
			const seleccionados = document.getElementById('jugadoresSeleccionados');
			const sinJugadores = document.getElementById('sinJugadores');

			const normalizar = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
			const estaSeleccionado = id => seleccionados.querySelector('[data-id="' + id + '"]') !== null;

			function filtrar() {
				const q = normalizar(input.value.trim());
				let visibles = 0;
				opciones.forEach(op => {
					const coincide = normalizar(op.textContent).includes(q) && !estaSeleccionado(op.dataset.id);
					op.classList.toggle('d-none', !coincide);
					op.classList.remove('activo');
					if (coincide) visibles++;
				});
				sinCoincidencias.classList.toggle('d-none', visibles > 0);
				const primera = opciones.find(op => !op.classList.contains('d-none'));
				if (primera) primera.classList.add('activo');
			}

			function mostrar() { filtrar(); lista.classList.remove('d-none'); }
			function ocultar() { lista.classList.add('d-none'); }

			function actualizarVacio() {
				sinJugadores.classList.toggle('d-none', seleccionados.children.length > 0);
			}

			function agregar(id, texto) {
				if (estaSeleccionado(id)) return;
				const chip = document.createElement('span');
				chip.className = 'chip-jugador';
				chip.dataset.id = id;
				chip.innerHTML = '<i class="bi bi-person-fill"></i><span></span>'
					+ '<input type="hidden" name="jugadorIds">'
					+ '<button type="button" class="btn-close btn-close-white" aria-label="Quitar"></button>';
				chip.querySelector('span').textContent = texto;
				chip.querySelector('input').value = id;
				chip.querySelector('button').addEventListener('click', () => {
					chip.remove();
					actualizarVacio();
				});
				seleccionados.appendChild(chip);
				actualizarVacio();
			}

			opciones.forEach(op => {
				if (op.dataset.seleccionado === 'true') agregar(op.dataset.id, op.dataset.texto);
				op.addEventListener('click', () => {
					agregar(op.dataset.id, op.dataset.texto);
					input.value = '';
					ocultar();
				});
			});

			input.addEventListener('focus', mostrar);
			input.addEventListener('input', mostrar);
			input.addEventListener('keydown', e => {
				const visibles = opciones.filter(op => !op.classList.contains('d-none'));
				let i = visibles.findIndex(op => op.classList.contains('activo'));
				if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
					e.preventDefault();
					if (!visibles.length) return;
					if (i >= 0) visibles[i].classList.remove('activo');
					i = e.key === 'ArrowDown' ? (i + 1) % visibles.length : (i - 1 + visibles.length) % visibles.length;
					visibles[i].classList.add('activo');
					visibles[i].scrollIntoView({ block: 'nearest' });
				} else if (e.key === 'Enter') {
					e.preventDefault(); // no enviar el formulario al elegir con Enter
					if (i >= 0) visibles[i].click();
				} else if (e.key === 'Escape') {
					ocultar();
				}
			});
			document.addEventListener('click', e => { if (!buscador.contains(e.target)) ocultar(); });

			actualizarVacio();
		})();
	</script>
</body>
</html>
